# Requests one reviewer per PR, by lane, and trims CODEOWNERS double requests.
# Lanes and other settings: .github/assign-reviewers.yml
# Logic and docs: .github/scripts/assign-reviewers.js and .github/scripts/README.md
#
# Repo variables:
#   ASSIGN_DRY_RUN  'false' = live. Anything else (or unset) = dry run (log only).
#   ASSIGN_SINCE    ISO date; only PRs created at/after this are touched. Unset = do nothing.
#   REVIEWERS_AWAY  Comma-separated logins to skip (e.g. "pq").
name: Assign reviewers

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      only_pr:
        description: 'Only process this PR number (for testing)'
        required: false
        type: string
      write:
        description: 'With only_pr: apply changes even when ASSIGN_DRY_RUN is not "false"'
        required: false
        type: boolean
        default: false

concurrency:
  group: assign-reviewers
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  assign:
    # Don't run in forks.
    if: github.repository == 'flutter/dart-intellij-third-party'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checks out the default branch only; no PR code is ever checked out or run.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github
          persist-credentials: false
      # github-script has no YAML parser; yq is preinstalled on GitHub's Ubuntu runners.
      - name: Read config
        run: yq -o=json '.' .github/assign-reviewers.yml > "$RUNNER_TEMP/assign-reviewers.json"
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ASSIGN_CONFIG_JSON: ${{ runner.temp }}/assign-reviewers.json
          ASSIGN_DRY_RUN: ${{ vars.ASSIGN_DRY_RUN }}
          ASSIGN_SINCE: ${{ vars.ASSIGN_SINCE }}
          REVIEWERS_AWAY: ${{ vars.REVIEWERS_AWAY }}
          ONLY_PR: ${{ inputs.only_pr }}
          FORCE_WRITE: ${{ inputs.write }}
        with:
          script: |
            const run = require('./.github/scripts/assign-reviewers.js');
            await run({github, context, core});
