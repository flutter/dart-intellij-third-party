name: presubmit

on:
  pull_request:
  push:
    branches:
      - main
      - '2025.2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job 0: Check AI Configuration and Agent Skills
  check-ai-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Check agent skills documentation
        run: ./tool/check_agent_skills.sh
      - name: Lint agent skills
        run: ./tool/validate_skills.sh
      - name: Check AI ignore configurations
        run: ./tool/check_ai_config.sh

  # Job 1: Build Plugin
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin' # Recommended distribution
          java-version: '21' # Match version in build.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build Plugin Action
        run: ./gradlew buildPlugin
        working-directory: third_party

  # Job 2: Unit Tests
  unit-tests:
    needs: build-plugin
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }} # Use the OS from the matrix
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin' # Recommended distribution
          java-version: '21' # Match version in build.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Provision Dart SDK
        run: ../tool/provision_dart.sh
        working-directory: third_party
        shell: bash

      - name: Unit Test Action
        run: |
          export DART_HOME="$GITHUB_WORKSPACE/dart-sdk"
          ./gradlew :test --tests "com.jetbrains.lang.dart.*"
        working-directory: third_party
        shell: bash

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  # Job 3: Verify Plugin
  verify-plugin:
    needs: build-plugin
    strategy:
      matrix:
        # Note that `ubuntu-large` is required here lest we hit IO exceptions on linux (see, e.g., https://github.com/flutter/dart-intellij-third-party/issues/220)
        os: [ ubuntu-large ]
        # If we can address IO failures on other platforms, we might widen the matrix too
        # os: [ ubuntu-large, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }} # Use the OS from the matrix
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Free up disk space (on ubuntu only)
        if: ${{ matrix.os == 'ubuntu-large' }}
        # Inspired by the https://github.com/marketplace/actions/free-disk-space-ubuntu action
        # See: https://github.com/flutter/dart-intellij-third-party/issues/220
        run: |
          echo "Freeing disk space...\n"
          echo "Before:\n"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "After:\n"
          df -h

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin' # Recommended distribution
          java-version: '21' # Match version in build.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # `verifyPlugin` gates on severity via `failureLevel` in build.gradle.kts.
      # The steps below use `!cancelled()` so that a failure in one verification
      # still reports the others, and so that "Check baselines" always runs to
      # explain *which* issues are new -- that diagnosis is the whole point, and
      # it used to be skipped precisely when the verifier failed.
      - name: Verify Plugin Actions
        run: ./gradlew verifyPlugin
        working-directory: third_party

      - name: Verify Plugin Project Configuration
        if: ${{ !cancelled() }}
        run: ./gradlew verifyPluginProjectConfiguration
        working-directory: third_party

      - name: Verify Plugin Signature
        if: ${{ !cancelled() }}
        run: ./gradlew verifyPluginSignature
        working-directory: third_party

      - name: Verify Plugin Structure
        if: ${{ !cancelled() }}
        run: ./gradlew verifyPluginStructure
        working-directory: third_party

      - name: Upload verifier results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: build
          path: |
            **/build/reports/
            **/build/test-results/

      # Diffs every report produced above against tool/baseline/<IDE branch>/.
      # New problems are surfaced as job annotations and in the job summary.
      - name: Check baselines
        if: ${{ !cancelled() }}
        run: ./third_party/tool/check_verifier_baselines.sh check
