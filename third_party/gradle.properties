# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

# This file was originally generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

pluginName = Dart
pluginId = Dart

# SemVer format -> https://semver.org

# TODO(https://github.com/flutter/dart-intellij-third-party/issues/23) Add a changelog
# Not currently used in the build.gradle.kts file:
# pluginRepositoryUrl = https://github.com/flutter/dart-intellij-third-party

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 253

ideaVersion = 2026.1.3

javaVersion = 21

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# Allocate additional JVM space for assembing this project
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Bundled plugins to keep off the test classpath. Since IntelliJ Platform Gradle
# Plugin 2.20.0, every bundled plugin of the target IDE is on the test classpath
# (the old `testIdeBundledPluginsClasspathEnabled` opt-out was removed).
# Setting this property replaces the plugin's default list, so the first six IDs
# repeat the 2.20.0 defaults.
# - HtmlTools: its HtmlReferenceContributor adds its own references to HTML
#   `href` values, and with it loaded, renaming a file no longer updates Dart
#   `packages/` links (DartRenameTest.testReferencedHtmlInPackage).
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes = com.intellij.openRewrite,com.intellij.ja,com.intellij.ko,com.intellij.zh,org.jetbrains.plugins.vue,org.jetbrains.plugins.clion.radler,HtmlTools

